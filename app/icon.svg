<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="DS">
  <title>Devang Sharma</title>
  <!-- The DS monogram, plotted from the same coordinates Blueprint's hero graph
       draws. Geometry only: no font to be missing, no text to be re-shaped.
       Signal's palette answers a dark UA, Blueprint's a light one. -->
  <style>
    :root { color-scheme: light dark; }
    .ground { fill: #efece4; }
    .mark   { stroke: #14161a; }
    .dot    { fill: #ed7940; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #0b0b0d; }
      .mark   { stroke: #f2f2ef; }
      .dot    { fill: #9ce824; }
    }
  </style>
  <rect class="ground" width="100" height="100" rx="12"/>
  <g class="mark" fill="none" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.00 17.76 L14.00 82.24"/>
    <path d="M14.00 17.76 L26.90 17.76 L37.64 24.21 L43.01 39.25 L43.01 60.75 L37.64 75.79 L26.90 82.24 L14.00 82.24"/>
    <path d="M86.00 22.06 L72.03 17.76 L59.13 26.36 L61.28 41.40 L74.18 50.00 L84.93 58.60 L82.78 73.64 L69.88 82.24 L56.99 77.94"/>
  </g>
  <circle class="dot" cx="86.00" cy="22.06" r="7.41"/>
</svg>
